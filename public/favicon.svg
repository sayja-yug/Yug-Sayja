<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Dark Cyber background gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Vibrant Cyber Cyan-Purple Glow Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Metallic/Glow Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base (Rounded Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="12" />

  <!-- Subtle Cyber Tech Grid lines -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="2">
    <line x1="96" y1="16" x2="96" y2="496" />
    <line x1="176" y1="16" x2="176" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="336" y1="16" x2="336" y2="496" />
    <line x1="416" y1="16" x2="416" y2="496" />
    <line x1="16" y1="96" x2="496" y2="96" />
    <line x1="16" y1="176" x2="496" y2="176" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="336" x2="496" y2="336" />
    <line x1="16" y1="416" x2="496" y2="416" />
  </g>

  <!-- Outer Chip Pins / ML Circuit Connectors -->
  <g fill="url(#primary-grad)" opacity="0.8">
    <!-- Top pins -->
    <rect x="176" y="44" width="16" height="32" rx="4" />
    <rect x="248" y="44" width="16" height="32" rx="4" />
    <rect x="320" y="44" width="16" height="32" rx="4" />
    <!-- Bottom pins -->
    <rect x="176" y="436" width="16" height="32" rx="4" />
    <rect x="248" y="436" width="16" height="32" rx="4" />
    <rect x="320" y="436" width="16" height="32" rx="4" />
    <!-- Left pins -->
    <rect x="44" y="176" width="32" height="16" rx="4" />
    <rect x="44" y="248" width="32" height="16" rx="4" />
    <rect x="44" y="320" width="32" height="16" rx="4" />
    <!-- Right pins -->
    <rect x="436" y="176" width="32" height="16" rx="4" />
    <rect x="436" y="248" width="32" height="16" rx="4" />
    <rect x="436" y="320" width="32" height="16" rx="4" />
  </g>

  <!-- CPU Outer Frame Hex/Octagon -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="#090e1a" stroke="url(#primary-grad)" stroke-width="6" filter="url(#subtle-glow)" />

  <!-- Neural Network Connections & Circuit Traces inside chip -->
  <g stroke="url(#primary-grad)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6">
    <!-- Corner Nodes to Center -->
    <path d="M 140 140 L 190 190" />
    <path d="M 372 140 L 322 190" />
    <path d="M 140 372 L 190 322" />
    <path d="M 372 372 L 322 322" />
  </g>

  <!-- Neural Node Dots -->
  <g fill="#00f2fe" filter="url(#subtle-glow)">
    <circle cx="140" cy="140" r="8" />
    <circle cx="372" cy="140" r="8" fill="#a855f7" />
    <circle cx="140" cy="372" r="8" fill="#a855f7" />
    <circle cx="372" cy="372" r="8" />
  </g>

  <!-- Central Emblem: Machine Learning Core "YS" Monogram + Brain Circuit -->
  <g filter="url(#neon-glow)">
    <!-- Y Letter -->
    <path d="M 165 175 L 225 255 L 225 335" 
          stroke="url(#primary-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 285 175 L 225 255" 
          stroke="url(#primary-grad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- S Letter -->
    <path d="M 345 190 C 345 170, 295 165, 285 200 C 275 235, 345 250, 335 295 C 325 340, 270 335, 260 315" 
          stroke="url(#primary-grad)" stroke-width="28" stroke-linecap="round" fill="none" />
  </g>

  <!-- Inner Sparkle / AI Core Power Node -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" filter="url(#neon-glow)" />
</svg>
